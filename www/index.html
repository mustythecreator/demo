<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Silk &amp; Steel: Conquest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--p:#0d141dee;--l:#1f3a5a;--a:#2f8cff;--up:#22c55e;--dn:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#070b11;color:#e8edf3;font:13px system-ui,sans-serif;overflow:hidden}
#app{display:flex;height:100%}#cw{flex:1;position:relative;min-width:0}canvas{display:block;touch-action:none}
button{background:#1a2433;color:#e8edf3;border:1px solid var(--l);border-radius:6px;padding:7px 9px;font:inherit;font-weight:700;font-size:12px}
button:active,button.on{background:var(--a);border-color:var(--a)}
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:6px 10px;background:linear-gradient(#070b11ee,#070b1100)}
.st small{display:block;font-size:8px;letter-spacing:.15em;color:#7f93ab}.st b{font-size:16px}#clock{flex:1;text-align:right;color:#9fb0c4;font-size:12px}
.pn{position:absolute;background:var(--p);border:1px solid var(--l);border-radius:8px;padding:7px 9px}
#obj{left:8px;top:46px;width:190px;font-size:11px;line-height:1.5}#obj b{display:block;color:#ffd56b;margin-bottom:2px}.ok{color:var(--up)}
#news{left:8px;bottom:56px;width:230px;font-size:11px;line-height:1.45}
#news .u::before{content:'▲ ';color:var(--up)}#news .d::before{content:'✖ ';color:var(--dn)}#news .i::before{content:'ℹ ';color:var(--a)}#news .w::before{content:'⚔ ';color:#ffb347}
#bar{left:50%;transform:translateX(-50%);bottom:8px;display:flex;gap:6px;align-items:center;width:max-content;max-width:96%}#sel{font-size:11px;color:#9fb0c4;max-width:170px}
#side{width:min(36vw,250px);background:#0b1118;border-left:1px solid var(--l);padding:8px;overflow:auto}
.mh{font-weight:800;font-size:14px;margin-bottom:6px;color:#fff}
.ar{display:grid;grid-template-columns:1fr auto auto 26px;gap:5px;padding:7px 6px;border-radius:6px;border:1px solid transparent;font-size:12px;align-items:center}.ar.on{background:#14223a;border-color:var(--a)}
.ap{font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}.ah{color:#ffd56b;font-size:11px}
.qs{display:flex;gap:4px;margin:8px 0 4px}.qs button{flex:1;padding:6px 0}.tt{font-size:11px;color:#9fb0c4;margin:4px 0}
.bs{display:flex;gap:6px}.bs button{flex:1;padding:10px 0;font-size:13px}.bb{background:#15803d;border-color:#22c55e}.sb{background:#991b1b;border-color:#ef4444}
#ov{position:absolute;inset:0;background:#05080ce6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#ov h1{font-size:26px;letter-spacing:.1em;text-transform:uppercase}#ov h1 small{display:block;font-size:11px;letter-spacing:.3em;color:var(--a);margin-top:4px}
#ov p{max-width:420px;color:#9fb0c4;line-height:1.5}#ov button{background:var(--a);border:0;padding:12px 36px;font-size:15px;letter-spacing:.15em}
@media(orientation:portrait){#app{flex-direction:column}#side{width:100%;height:44%;border-left:0;border-top:1px solid var(--l)}#obj{width:150px;font-size:10px}#news{left:auto;right:8px;top:46px;bottom:auto;width:46%;font-size:10px}}
</style></head><body>
