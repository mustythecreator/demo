name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copy three.js libs into the app
        run: |
          npm install --no-save three@0.128.0
          mkdir -p www/lib
          cp node_modules/three/build/three.min.js www/lib/
          cp node_modules/three/examples/js/libs/fflate.min.js www/lib/
          cp node_modules/three/examples/js/loaders/GLTFLoader.js node_modules/three/examples/js/loaders/FBXLoader.js www/lib/
          cp node_modules/three/examples/js/utils/SkeletonUtils.js www/lib/
      - run: npx cap add android
      # Optional landscape lock: uncomment next line
      # - run: sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: silk-steel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
